name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL server Auralys (opsional). Kosongkan bila ingin diisi di HP saat pertama dibuka."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" | tail -2

      - name: (Opsional) Sematkan URL server ke dalam APK
        if: ${{ github.event.inputs.server_url != '' }}
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          url = os.environ["SERVER_URL"].strip()
          p = pathlib.Path("android/src/main/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'<string name="server_url"[^>]*>.*?</string>',
                     f'<string name="server_url" translatable="false">{url}</string>', s)
          p.write_text(s, encoding="utf-8")
          print("server_url =", url)
          PY

      - name: Build APK (signed, keystore baru per build)
        run: |
          chmod +x android/build-apk.sh
          cd android && ./build-apk.sh

      - name: Upload artefak
        uses: actions/upload-artifact@v4
        with:
          name: Auralys-apk
          path: android/build/Auralys.apk
          if-no-files-found: error

      - name: Lampirkan ke Release (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/Auralys.apk
          generate_release_notes: true
