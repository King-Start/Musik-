<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f6f6f6" />
<title>Auralys — Musik</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/app.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <div id="splash" class="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 48 48" width="56" height="56"><circle cx="24" cy="24" r="23" fill="none" stroke="currentColor" stroke-width="2" opacity=".25"/><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/><path d="M20 15.5 33 24 20 32.5z" fill="currentColor"/></svg>
      </div>
      <div class="splash-name">Auralys</div>
      <div class="spinner" id="splash-spinner"></div>
    </div>

    <div class="phone" id="phone">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>

      <div class="miniplayer" id="miniplayer" hidden></div>
      <nav class="tabbar" id="tabbar"></nav>

      <div class="player-sheet" id="player-sheet" hidden></div>
      <div class="sheet-host" id="sheet-host"></div>
      <div class="toast-host" id="toast-host"></div>
      <div class="menu-host" id="menu-host"></div>
    </div>
  </div>
  <div id="ytwrap" aria-hidden="true"><div id="ytplayer"></div></div>
  <script src="/js/icons.js"></script>
  <script>
    // Muat modul aplikasi. Jika dibuka lewat file:// (modul ES diblokir browser),
    // tampilkan petunjuk singkat alih-alih halaman kosong.
    (function () {
      if (location.protocol === "file:") {
        document.body.innerHTML = '<div style="font-family:system-ui;padding:32px;line-height:1.7;max-width:520px;margin:auto">' +
          '<h2>Auralys perlu dijalankan lewat server</h2>' +
          '<p>Jalankan <code>npm start</code> di folder aplikasi, lalu buka <code>http://localhost:8080</code>.</p>' +
          '<p>Butuh server karena aplikasi mengambil data lagu dari YouTube Music lewat backend kecil (Node.js).</p></div>';
        return;
      }
      var s = document.createElement("script");
      s.type = "module";
      s.src = "/js/app.js";
      s.onerror = function () {
        if (location.protocol === "file:") {
          document.body.innerHTML = '<div style="font-family:system-ui;padding:32px;line-height:1.7;max-width:520px;margin:auto">' +
            '<h2>Auralys perlu dijalankan lewat server</h2>' +
            '<p>Berkas <code>app-standalone.html</code> di folder yang sama sudah bisa dibuka langsung (offline, tanpa server).</p>' +
            '<p>Atau jalankan <code>npm start</code> di folder aplikasi lalu buka <code>http://localhost:8080</code>.</p></div>';
        }
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
